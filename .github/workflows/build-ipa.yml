# MalodySlideEditor を GitHub の Mac で自動ビルドして、SideStore 用の ipa を作る設定ファイルです。
# このファイルは、リポジトリの  .github/workflows/build-ipa.yml  という場所に置きます。
#
# 動くタイミング:
#   1) main ブランチに変更を保存(Commit)したとき  2) Actions タブの「Run workflow」ボタンを押したとき
# 結果:
#   リポジトリの Releases に「latest」が作られ、その中に BeatTriXEditor.ipa が入ります。

name: ipaを作る

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # Releases に ipa を載せるために必要

jobs:
  build:
    runs-on: macos-15    # GitHub が貸してくれる Mac (Xcode 入り)
    timeout-minutes: 30

    steps:
      - name: ソースを取ってくる
        uses: actions/checkout@v4

      - name: Xcode のバージョンを表示
        run: xcodebuild -version

      # Rubber Band 本体を取得し、Swift から参照できる C++ モジュールを用意する。
      - name: Rubber Band を取り込む
        run: |
          set -e
          git clone --depth 1 --branch v4.0.0 https://github.com/breakfastquay/rubberband.git /tmp/rb
          D=Vendor/CRubberBand
          mkdir -p "$D/include"
          cp -R /tmp/rb/src "$D/src"
          cp -R /tmp/rb/rubberband "$D/rubberband"
          cp -R /tmp/rb/single "$D/single"
          cp /tmp/rb/COPYING "$D/COPYING"
          cp /tmp/rb/rubberband/rubberband-c.h "$D/include/rubberband-c.h"
          printf 'module CRubberBand {\n    header "rubberband-c.h"\n    export *\n}\n' > "$D/include/module.modulemap"

      # Playgrounds 用の Package.swift は残さず、Actions のビルド中だけ C++ ターゲットを加える。
      - name: ビルド用の Package.swift に差し替える
        run: |
          cat > Package.swift <<'EOF'
          // swift-tools-version: 5.8
          import PackageDescription
          import AppleProductTypes

          let package = Package(
              name: "MalodySlideEditor",
              platforms: [
                  .iOS("15.0")
              ],
              products: [
                  .iOSApplication(
                      name: "MalodySlideEditor",
                      targets: ["AppModule"],
                      bundleIdentifier: "local.beatrix.charteditor",
                      teamIdentifier: "",
                      displayVersion: "1.0",
                      bundleVersion: "1",
                      appIcon: .placeholder(icon: .map),
                      accentColor: .presetColor(.cyan),
                      supportedDeviceFamilies: [
                          .pad,
                          .phone
                      ],
                      supportedInterfaceOrientations: [
                          .landscapeRight,
                          .landscapeLeft,
                          .portrait
                      ]
                  )
              ],
              targets: [
                  .executableTarget(
                      name: "AppModule",
                      dependencies: ["CRubberBand"],
                      path: ".",
                      exclude: ["Vendor", "AppIcon"]
                  ),
                  .target(
                      name: "CRubberBand",
                      path: "Vendor/CRubberBand",
                      sources: ["single/RubberBandSingle.cpp"],
                      publicHeadersPath: "include",
                      cxxSettings: [
                          .headerSearchPath("."),
                          .define("NDEBUG")
                      ],
                      linkerSettings: [
                          .linkedFramework("Accelerate")
                      ]
                  )
              ],
              cxxLanguageStandard: .cxx17
          )
          EOF

      - name: ビルド (署名なし)
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme MalodySlideEditor \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      # xcodebuild は Swift Playgrounds 形式のパッケージから「実行ファイル」までしか作ってくれず、
      # .app (アプリの入れ物) は作ってくれない。なので、.app は自分で組み立てる。
      - name: 実行ファイルから .app を組み立てて ipa にまとめる
        run: |
          BIN=build/Build/Products/Release-iphoneos/MalodySlideEditor
          if [ ! -f "$BIN" ]; then
            echo "error: 実行ファイルが見つかりません: $BIN"
            find build/Build/Products -maxdepth 3 || true
            exit 1
          fi
          file "$BIN"
          # 対応している iOS の最低バージョン (minos) を表示する (iOS 15 でも入るか確認用)
          MINOS=$(otool -l "$BIN" | grep -A4 LC_BUILD_VERSION | grep minos | awk '{print $2}' | head -1)
          echo "::notice::minos = $MINOS"
          rm -rf Payload BeatTriXEditor.ipa
          mkdir -p Payload/MalodySlideEditor.app
          cp "$BIN" Payload/MalodySlideEditor.app/MalodySlideEditor
          cp AppIcon/AppIcon*.png Payload/MalodySlideEditor.app/      # アプリのアイコン (BT のロゴ)
          chmod +x Payload/MalodySlideEditor.app/MalodySlideEditor
          cat > Payload/MalodySlideEditor.app/Info.plist <<'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleExecutable</key><string>MalodySlideEditor</string>
            <key>CFBundleIdentifier</key><string>local.beatrix.charteditor</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>BeatTriX Editor</string>
            <key>CFBundleDisplayName</key><string>BeatTriX Editor</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
            <key>MinimumOSVersion</key><string>15.0</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
            <key>UILaunchScreen</key><dict/>
            <key>CFBundleIcons</key>
            <dict>
              <key>CFBundlePrimaryIcon</key>
              <dict>
                <key>CFBundleIconFiles</key><array><string>AppIcon60x60</string></array>
              </dict>
            </dict>
            <key>CFBundleIcons~ipad</key>
            <dict>
              <key>CFBundlePrimaryIcon</key>
              <dict>
                <key>CFBundleIconFiles</key><array><string>AppIcon60x60</string><string>AppIcon76x76</string><string>AppIcon83.5x83.5</string></array>
              </dict>
            </dict>
            <key>UIFileSharingEnabled</key><true/>
            <key>LSSupportsOpeningDocumentsInPlace</key><true/>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationLandscapeRight</string>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationPortrait</string>
            </array>
            <key>UISupportedInterfaceOrientations~ipad</key>
            <array>
              <string>UIInterfaceOrientationLandscapeRight</string>
              <string>UIInterfaceOrientationLandscapeLeft</string>
            </array>
          </dict>
          </plist>
          PLISTEOF
          plutil -lint Payload/MalodySlideEditor.app/Info.plist
          zip -qry BeatTriXEditor.ipa Payload
          ls -lh BeatTriXEditor.ipa

      - name: Releases に載せる (ipa を直接ダウンロードできるようにする)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BeatTriXEditor.ipa \
            --target "$GITHUB_SHA" \
            --title "最新ビルド" \
            --notes "SideStore で入れる用の ipa です (署名なし)。"

      - name: ipa を Actions の成果物としても保存 (予備)
        uses: actions/upload-artifact@v4
        with:
          name: BeatTriXEditor-ipa
          path: BeatTriXEditor.ipa

      # 失敗したときだけ動く。ここに出る文章を、そのままコピーして Claude に貼ってください
      - name: 失敗したときの要点
        if: failure()
        run: |
          echo "=== error の行 ==="
          grep -n "error:" build.log | head -40 || true
          # エラーを Actions の「注釈」にも出す (画面の Summary にまとめて表示される)
          grep "error:" build.log | sort -u | head -20 | while IFS= read -r line; do echo "::error::$line"; done || true
          echo "=== ログの最後 40 行 ==="
          tail -40 build.log || true
